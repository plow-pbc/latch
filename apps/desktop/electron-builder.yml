# Packaging config for `just package` — signed + notarized Domo Desktop.app + DMG.
# Signing identity is pinned to the Plow Developer ID; notarization credentials
# come from the keychain profile named by APPLE_KEYCHAIN_PROFILE (see justfile).
appId: com.plowcollective.domo-desktop
productName: Domo Desktop

directories:
  output: release
  buildResources: build

# dist/ is the tsc output plus renderer assets; node_modules is collected
# automatically from the workspace root by electron-builder.
files:
  - dist/**/*
  - "!dist/**/*.d.ts"
  - "!dist/**/*.d.cts"
  - "!dist/**/*.map"

# The domo-mcp shim (and everything it imports) must exist as real files, not
# asar entries — "Start agent" runs it with a plain `node` from a Claude
# session's MCP config, and node can't read inside an asar archive.
asarUnpack:
  - node_modules/@domo/app-mcp/**
  - node_modules/@domo/protocol/**
  - node_modules/@domo/transport/**
  - node_modules/ws/**

mac:
  icon: ../../artwork/domo-desktop-icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: universal
  identity: "The Plow Collective, Inc (3559PD337Z)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

dmg:
  artifactName: ${productName}-${version}.${ext}
  # Explicit Finder-window geometry: the defaults sit the icons low enough
  # that the window shows a scrollbar. Icons up at mid-height, roomier window.
  # The window ALWAYS matches the background image's size (window.width/height
  # are ignored otherwise), so a 540×420 background is what sets the height.
  background: build/dmg-background.tiff
  iconSize: 80
  window:
    width: 540
    height: 420
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

npmRebuild: false
