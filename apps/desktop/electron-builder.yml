# Packaging config for `just package` — signed + notarized "Plow Latch.app" + DMG.
# Signing identity is pinned to the Plow Developer ID; notarization credentials
# come from the keychain profile named by APPLE_KEYCHAIN_PROFILE (see justfile).
# appId is NOT renamed with the product. It is the bundle identity macOS and
# electron-updater match on, so changing it strands every installed user: their
# app would never see a build under a different identity as an update. Same for
# the `domo` publish prefix below — it is baked into shipped bundles as
# app-update.yml.
#
# No productName here: electron-builder falls back to the app's package.json,
# and the recipe runs it from apps/desktop.
appId: co.plow.domo-desktop

# Hyphenated artifact names: these become S3 keys and feed URLs, where spaces
# (the productName default) mean %20-encoding everywhere a human pastes a link.
artifactName: Plow-Latch-${version}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# Where installed apps poll for updates (electron-updater generic provider —
# static files, no update server). electron-builder bakes this into the
# packaged app as app-update.yml; electron-updater reads latest-mac.yml at this
# URL and downloads the zip named inside it from the same directory. The
# versioned-then-promote flow lives in `just release` / `just promote`: this
# URL only ever serves what promote has copied to the stable keys. Uploads are
# the release scripts' job — electron-builder never publishes to this provider
# (the package recipe passes --publish never).
publish:
  provider: generic
  url: https://s3.us-west-2.amazonaws.com/releases.plow.co/domo

# dist/ is the tsc output plus renderer assets; node_modules is collected
# automatically from the workspace root by electron-builder. The node_modules
# ignores drop what only tooling reads (type declarations, source maps, docs);
# LICENSE/NOTICE files are deliberately shipped — redistribution requires them.
files:
  - dist/**/*
  # Browser-only fixture picker; copied to dist for the fast visual loop but
  # never installed in the app bundle.
  - "!dist/renderer/onboarding-dev.html"
  - "!dist/renderer/onboarding-dev.js"
  - "!dist/renderer/onboarding-fixtures.js"
  # The compiled native helper ships as an extraResource below — inside the
  # asar it could not be spawned at all.
  - "!dist/native/**"
  - "!dist/**/*.d.ts"
  - "!dist/**/*.d.cts"
  - "!dist/**/*.map"
  - "!node_modules/**/*.d.ts"
  - "!node_modules/**/*.d.mts"
  - "!node_modules/**/*.d.cts"
  - "!node_modules/**/*.map"
  - "!node_modules/**/{README,Readme,readme,CHANGELOG,Changelog,changelog,HISTORY,History,history}*"
  # Dead weight verified unreferenced at runtime (see the audit that added each
  # line — every entry below was traced to zero require/import paths in the
  # packaged process graph before being excluded):
  # playwright-core: we only load index.js → coreBundle/utilsBundle. The vite
  # web UIs (trace viewer, recorder, html report, dashboard), the CLI and its
  # registry, the reinstall scripts in bin/, and the Linux xdg-open shim are
  # only reachable from playwright's own CLI/recorder features, which nothing
  # in this app invokes.
  - "!node_modules/playwright-core/lib/vite/**"
  - "!node_modules/playwright-core/lib/tools/**"
  - "!node_modules/playwright-core/lib/serverRegistry.js"
  - "!node_modules/playwright-core/lib/serverRegistry.js.LICENSE"
  - "!node_modules/playwright-core/bin/**"
  - "!node_modules/playwright-core/lib/xdg-open"
  - "!node_modules/playwright-core/cli.js"
  # native-keychain and native-credential-import ship only the prebuilt addon
  # and its loader; the gyp sources and install scripts are build-time.
  - "!node_modules/@domo/native-keychain/scripts/**"
  - "!node_modules/@domo/native-keychain/src/**"
  - "!node_modules/@domo/native-credential-import/scripts/**"
  - "!node_modules/@domo/native-credential-import/src/**"
  # Every consumer of zod and @modelcontextprotocol/* in the app is ESM, so the
  # parallel CJS builds are never resolved; zod's src/ is TypeScript source
  # shipped for sourcemap tooling only.
  - "!node_modules/zod/src/**"
  - "!node_modules/zod/**/*.cjs"
  - "!node_modules/@modelcontextprotocol/**/*.cjs"
  # js-yaml is only required (CJS) by electron-updater, which resolves
  # index.js → lib/; dist/ holds the browser/ESM bundles. argparse is js-yaml's
  # CLI-only dependency; the library never loads it.
  - "!node_modules/js-yaml/dist/**"
  - "!node_modules/argparse/**"
  # tldts has no "exports" map, so Node resolves main → dist/cjs for both
  # import and require; the es6 trees, minified browser bundles, and TS
  # sources are bundler-only artifacts.
  - "!node_modules/tldts/dist/es6/**"
  - "!node_modules/tldts/dist/index.*.min.js"
  - "!node_modules/tldts/src/**"
  - "!node_modules/tldts-core/dist/es6/**"
  - "!node_modules/tldts-core/src/**"
  # Vitest leaves *_vite_proxy.tmp.* droppings inside node_modules when a test
  # run is interrupted; never ship one.
  - "!node_modules/**/*_vite_proxy.tmp.*"

# Keep only English in Electron's own locale payload (~55 lproj dirs, ~40 MB);
# the app UI ships no other localization.
electronLanguages:
  - en

# The browser server is a Node script (@domo/browser-server) spawned on the app
# binary under ELECTRON_RUN_AS_NODE; it and its runtime deps are UNPACKED from the
# asar so the spawned node reads real files (playwright-core's package files,
# node-sqlite3-wasm's .wasm). NO native modules ship: the cookie-merge SQLite is
# node-sqlite3-wasm — a WASM build, arch-neutral, loads under Electron with no
# rebuild (better-sqlite3 was ABI-locked and rejected). camoufox-js is BUILD-only
# (a root devDependency) and never collected.
asarUnpack:
  - "**/node_modules/@domo/browser-server/**"
  - "**/node_modules/playwright-core/**"
  - "**/node_modules/node-sqlite3-wasm/**"

# No fuses config — and the RunAsNode fuse MUST stay enabled. The browser server
# and the cookie merger run on this app binary via ELECTRON_RUN_AS_NODE; flipping
# runAsNode off breaks every browser launch. (A future cleanup could move them to
# utilityProcess and drop the requirement.) See DESIGN.md §11a, Runtime & packaging.

# The browser stack: the lipo-fused universal Camoufox tree. Built by
# scripts/build-browser-runtime.mjs (a `just package` dependency) and
# byte-identical in both electron-builder arch passes, so the universal merge
# copies it through untouched. Runtime code resolves it via process.resourcesPath
# ("browser-runtime/camoufox"). The server ships in node_modules (above), and the
# frozen fingerprint pool ships beside it (packages/browser-server/fingerprints.json).
extraResources:
  # The repo's own redistribution terms ride inside the bundle — recipients of
  # the DMG/update ZIP get them, not just readers of the source tree.
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
  - from: ../../vendor/camoufox-browser/universal
    to: browser-runtime/camoufox
    filter: ["**/*", "!.sha256"]
  # Every vendored provider CLI, per-arch, in ONE entry — the payloads live
  # under vendor/providers/<command>/<arch>/, so adding a provider edits nothing
  # here. resolveVendoredBinary looks the arch up by process.arch, so those
  # directory names are Node's (arm64, x64), not any release's. VERSION is each
  # provider's local staleness marker, not payload.
  - from: ../../vendor/providers
    to: providers
    filter: ["**/*", "!*/VERSION"]
  # The native helpers (scripts/build-native.mjs, a `just build` step): the
  # Full Disk Access flow's window tracker, the permission-status helper the
  # host-gate diagnosis asks about Automation, and the credential-exchange
  # shim dylib. Lipo-fused universal like the python runtime, so both
  # electron-builder arch passes carry identical bytes and the merge copies
  # them through. Signed by electron-builder with the app's entitlements —
  # nothing extra needed. The .stamp files are the build script's cache keys,
  # not payload, and the credential-provider .appex is not a resource at all:
  # build/afterPack.cjs embeds it under Contents/PlugIns (profile-gated),
  # which is the only place macOS looks for it.
  - from: dist/native
    to: native
    filter: ["**/*", "!*.stamp", "!PlowLatchCredentialProvider.appex/**"]

mac:
  icon: ../../artwork/domo-desktop-icon.png
  category: public.app-category.developer-tools
  # The DMG is what humans download; the ZIP is what Squirrel.Mac (via
  # electron-updater) applies as an update — auto-update on macOS cannot
  # consume a DMG. Both come from the same signed, notarized pack.
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  identity: "The Plow Collective, Inc (3559PD337Z)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # keychain-access-groups is a restricted entitlement: without a provisioning
  # profile authorizing it, AMFI kills the app at exec (Finder shows a bare
  # "can't be opened"). This is a Developer ID Application profile for
  # co.plow.domo-desktop from the portal; its keychain-access-groups grant is
  # the team wildcard (3559PD337Z.*), which covers the vault group. Embedded as
  # Contents/embedded.provisionprofile. Helpers deliberately inherit a plist
  # WITHOUT the group — the embedded profile does not cover nested code.
  provisioningProfile: build/PlowLatch-DeveloperID.provisionprofile
  # The Camoufox tree is already Developer-ID signed by
  # scripts/build-browser-runtime.mjs with Mozilla's own entitlements (full set,
  # incl. library-validation off). Tell electron-builder's signer to leave it
  # alone — a re-sign would stamp the app's minimal entitlements onto Firefox and
  # break it at runtime. The outer app signature still seals these files;
  # notarization sees our hardened-runtime + timestamped signatures on them.
  signIgnore:
    - "browser-runtime/.*"
    # The credential-provider appex is signed by afterPack.cjs with its OWN
    # entitlements + embedded provisioning profile; electron-builder's signer
    # re-signing it with the app's would strip both. The outer app signature
    # still seals it.
    - "PlugIns/.*"
  # The fused Camoufox tree is universal2, so the merge passes it through
  # untouched. Vendored provider CLIs are not: two THIN per-arch binaries copied
  # identically into both electron slices, so the merger would try to lipo a thin
  # binary against its identical twin and fail. This pattern passes them through
  # instead. The native-keychain and native-credential-import addons
  # (universal2, byte-identical in both slices) are refused by the merger the
  # same way. (No SQLite entry: the WASM cookie-merge module is arch-neutral,
  # so the merge handles it like any file.)
  x64ArchFiles: "**/{providers,node_modules/@domo/native-keychain,node_modules/@domo/native-credential-import}/**"
  notarize: true
  extendInfo:
    NSAppleEventsUsageDescription: "Plow Latch sends the Messages and automation commands you approve on this Mac."
    # The consent dialogs the Capabilities tab can raise on purpose
    # (native/host-permissions.swift --request) name the app and read these;
    # without them macOS refuses the request instead of asking.
    NSContactsUsageDescription: "Plow Latch reads and updates your contacts only for requests you approve."
    NSCalendarsUsageDescription: "Plow Latch reads your calendars only for requests you approve."
    NSCalendarsFullAccessUsageDescription: "Plow Latch reads your calendars only for requests you approve."
    # How macOS hands the app a credential-exchange import token (Apple
    # Passwords' "Export to another app…"): an NSUserActivity of this type,
    # which AppKit only delivers when the type is declared here. Electron
    # surfaces it as app.on("continue-activity") — see src/main.ts. Harmless
    # to declare in every build; without the profile-gated entitlement the
    # activity simply never arrives.
    NSUserActivityTypes:
      - ASCredentialExchangeActivity

# Re-sign browser-runtime after the universal merge (which rewrites nested
# Info.plists and breaks their seals) and before signing/notarization.
afterPack: build/afterPack.cjs

dmg:
  # No ${arch}: the only DMG is universal, and this name is the public
  # download link (promote copies it to the stable domo/Plow-Latch.dmg key).
  artifactName: Plow-Latch-${version}.${ext}
  # lzfse instead of the default zlib — meaningfully smaller download, needs
  # macOS 10.11+ to mount (well below the app's own floor). ULMO (lzma, a bit
  # smaller still) isn't in electron-builder 26's schema yet.
  format: ULFO
  # Explicit Finder-window geometry: the defaults sit the icons low enough
  # that the window shows a scrollbar. Icons up at mid-height, roomier window.
  # The window ALWAYS matches the background image's size (window.width/height
  # are ignored otherwise), so a 540×420 background is what sets the height.
  background: build/dmg-background.tiff
  iconSize: 80
  window:
    width: 540
    height: 420
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

npmRebuild: false
