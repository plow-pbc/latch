<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Same strict CSP as every other window: no remote content, no inline
         handlers. This screen handles credentials, so it is not the one to
         relax it on. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Domo — Set Up</title>
  </head>
  <body>
    <div class="onboard" id="root"></div>
    <script type="module" src="onboarding.js"></script>
  </body>
</html>
