<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Strict CSP: no remote content, no inline event handlers; only our own
         script/style files. This is a security surface (DESIGN.md §13.2). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Domo Desktop</title>
  </head>
  <body>
    <div class="titlebar">
      <span class="wtitle">Domo Desktop</span>
      <span class="status-dot" id="statusDot"></span>
      <span class="faint" id="statusText">…</span>
      <div class="seg" id="seg">
        <button data-tab="goals">Goals</button>
        <button data-tab="audit" class="active">Audit</button>
        <button data-tab="rules">Rules</button>
        <button data-tab="settings">Settings</button>
      </div>
    </div>
    <!-- Apple Passwords pairing banner: shown while a PIN is awaited (except on
         the Settings tab, which has its own pairing UI), hidden once paired. -->
    <div id="apwBanner" class="apw-banner hidden"></div>
    <div id="view"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
