name: Build release candidate

run-name: Manual build — ${{ github.ref_name }}@${{ github.sha }}

# Domo's port of Plow's build-release-candidate workflow: build, sign,
# notarize, upload versioned artifacts to S3, and open a DRAFT GitHub release.
# Publishing the draft fires promote-app.yml, which copies the artifacts to the
# stable keys installed apps poll — and which runs in the `release` environment
# itself, so publishing is the first of TWO approvals, not the whole gate.
#
# Manual dispatch only (no nightly cron): the leg against a real relay has no
# automated coverage and is verified by hand (README-ts.md § Integration
# coverage), so releases are cut deliberately, not on a timer.
#
# Dispatch it from ANY branch: main for a real candidate, a feature branch to
# get a signed, notarized build of unmerged work onto a test Mac. A build from
# anywhere but main is drafted as a PRERELEASE with the branch in its title,
# and promote-app.yml refuses to ship a prerelease, so publishing one by
# mistake cannot reach installed apps.
#
# Setup this workflow assumes (shared with Plow's release pipeline):
#   - a "release" environment with required reviewers and the
#     OP_SERVICE_ACCOUNT_TOKEN secret for the 1Password service account. The
#     environment's deployment branch policy must allow every branch this is
#     dispatched from (all branches, or a pattern covering them, plus the
#     v*-build.* tags promote-app.yml runs on) — a dispatch from a branch the
#     policy excludes is rejected before any step runs. The required reviewers
#     are what keep a dispatch from an arbitrary branch away from the signing
#     secret: a branch controls its own copy of this file, so a human looks at
#     what is being built before the runner gets the secret.
#   - the "GitHub Actions Release Secrets" 1Password item (same cert + notary
#     credentials — both apps sign as The Plow Collective, 3559PD337Z)
#   - AWS_RELEASE_ROLE_ARN's OIDC trust policy extended to THIS repository,
#     with S3 write access covering releases.plow.co/domo/*

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  macOS:
    environment: release
    runs-on: macos-26
    timeout-minutes: 90
    # Serialize builds: the version stamp (`just package`) has minute
    # resolution, so two overlapping runs could mint the same version, overwrite
    # each other's S3 prefix, and race to push the same tag.
    concurrency: domo-release-candidate

    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@just

      # Node 22+: the fingerprint pool `just package` freezes is sampled with
      # camoufox-js, whose better-sqlite3 (13.x) ships no Node 20 build — on 20
      # it segfaults inside build-browser-runtime.mjs (signal 11, no message).
      # The root package.json engines field says the same; keep them in step.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The browser stack `just package` bundles: universal Python runtime +
      # the lipo-fused universal Camoufox tree (both arches downloaded cold,
      # then fused). Everything is pinned by runtime.lock.json and the build
      # script is stamp-cached, so restoring vendor/ turns the fetch into a
      # no-op.
      - name: Cache browser runtime
        uses: actions/cache@v4
        with:
          path: |
            vendor/camoufox-browser
            packages/browser-server/fingerprints.json
          key: browser-runtime-${{ runner.arch }}-${{ hashFiles('vendor/browser-server/runtime.lock.json', 'scripts/build-browser-runtime.mjs') }}

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPLE_CERTIFICATE_P12_BASE64: op://terraform/GitHub Actions Release Secrets/APPLE_CERTIFICATE_P12_BASE64
          APPLE_CERTIFICATE_PASSWORD: op://terraform/GitHub Actions Release Secrets/APPLE_CERTIFICATE_PASSWORD  # pragma: allowlist secret
          APPLE_NOTARY_APPLE_ID: op://terraform/GitHub Actions Release Secrets/APPLE_NOTARY_APPLE_ID
          APPLE_NOTARY_TEAM_ID: op://terraform/GitHub Actions Release Secrets/APPLE_NOTARY_TEAM_ID
          APPLE_NOTARY_PASSWORD: op://terraform/GitHub Actions Release Secrets/APPLE_NOTARY_PASSWORD  # pragma: allowlist secret
          AWS_RELEASE_ROLE_ARN: op://terraform/GitHub Actions Release Secrets/AWS_RELEASE_ROLE_ARN

      - name: Import code signing certificate
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm "$CERT_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # `just package` notarizes via this keychain profile (APPLE_KEYCHAIN_PROFILE).
      - name: Store notarization credentials
        run: |
          xcrun notarytool store-credentials domo-notary \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --team-id "$APPLE_NOTARY_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-west-2

      - name: Install dependencies
        run: npm ci

      # The DMG is universal, but electron-builder's universal merge and the
      # browser-runtime re-sign have only ever been exercised on Apple Silicon.
      - name: Assert runner is Apple Silicon
        run: |
          host_arch="$(uname -m)"
          if [[ "$host_arch" != "arm64" ]]; then
            echo "error: release runner must be Apple Silicon (got uname -m: $host_arch)" >&2
            exit 1
          fi

      # Packages (signed + notarized), then uploads the versioned artifacts to
      # s3://releases.plow.co/domo/releases/<version>-<build>/. Stable keys are
      # untouched until a human publishes the draft release below.
      - name: Run release
        id: release
        run: just release domo-notary ""

      - name: Read version and build from the packaged app
        id: version
        run: |
          APP_BUNDLE="apps/desktop/release/mac-universal/Plow Latch.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_BUNDLE/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_BUNDLE/Contents/Info.plist")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-build.${BUILD}" >> "$GITHUB_OUTPUT"

      # A build from any branch but main is a prerelease: the title names the
      # branch, and promote-app.yml refuses prereleases, so publishing it cannot
      # move the stable keys. The branch name is collaborator-controlled, so it
      # reaches the shell through env, never ${{ }}-interpolated into the script.
      - name: Create draft GitHub Release
        id: draft_release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"
          DMG_URL="https://s3.us-west-2.amazonaws.com/releases.plow.co/domo/releases/${VERSION}-${BUILD}/Plow-Latch-${VERSION}.dmg"

          git tag "$TAG"
          git push origin "$TAG"

          TITLE="Plow Latch ${VERSION} (${BUILD})"
          EXTRA_FLAGS=()
          if [[ "$IS_MAIN" != "true" ]]; then
            TITLE="${TITLE} from ${REF_NAME}"
            EXTRA_FLAGS+=(--prerelease)
          fi

          RELEASE_URL=$(gh release create "$TAG" \
            --draft \
            ${EXTRA_FLAGS[@]+"${EXTRA_FLAGS[@]}"} \
            --title "$TITLE" \
            --notes "**Download:** [Plow-Latch-${VERSION}.dmg](${DMG_URL})

          Built from \`${REF_NAME}\` @ \`${{ github.sha }}\`")

          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$IS_MAIN" != "true" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Created draft release: $TAG ($RELEASE_URL)"

      - name: Job summary
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.draft_release.outputs.prerelease }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"
          RELEASE_URL="${{ steps.draft_release.outputs.release_url }}"
          PROMOTE_RUNS="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/promote-app.yml"
          if [[ -n "$VERSION" && -n "$BUILD" ]]; then
            DMG_URL="https://s3.us-west-2.amazonaws.com/releases.plow.co/domo/releases/${VERSION}-${BUILD}/Plow-Latch-${VERSION}.dmg"
            {
              echo "### Plow Latch ${VERSION} (${BUILD})"
              echo ""
              echo "- [Download DMG](${DMG_URL})"
              if [[ -n "$RELEASE_URL" && "$PRERELEASE" == "true" ]]; then
                echo "- [GitHub release draft](${RELEASE_URL}) (prerelease)"
                echo ""
                echo "This build is from \`${REF_NAME}\`, not \`main\`, so it is drafted as a **prerelease**. Install the DMG by hand to test it. Publishing the draft does NOT ship it: the **App release** workflow refuses prereleases, so nothing reaches installed apps. To ship this work, merge it and dispatch a build from \`main\`."
              elif [[ -n "$RELEASE_URL" ]]; then
                echo "- [GitHub release draft](${RELEASE_URL})"
                echo ""
                echo "#### How to ship this build to existing installs"
                echo ""
                echo "1. Open the [release draft](${RELEASE_URL}) and review it."
                echo "2. Confirm **Set as the latest release** is checked, then **Publish release**."
                echo "3. Publishing triggers the **App release** workflow, which ALSO runs in the \`release\` environment — so it starts as *Waiting*. The new run appears under [**App release** runs](${PROMOTE_RUNS}) — open it and use **Review deployments → Approve and deploy**."
                echo ""
                echo "Nothing reaches installed apps until that second approval: only then does the promote copy the versioned S3 artifacts onto the stable \`domo/latest-mac.yml\` + \`domo/Plow-Latch.dmg\` keys. Publishing and walking away leaves it waiting."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
