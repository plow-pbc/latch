name: TypeScript

# The shared packages (protocol, transport) are deliberately platform-neutral,
# so they are kept building and passing on Linux as well as macOS. The device
# half — sandbox (seatbelt) and the Electron app — is macOS-only.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      # Protocol + transport are platform-independent (golden vectors, crypto,
      # the WebSocket client) and run everywhere.
      - run: npx vitest run packages/protocol packages/transport
      # The device sandbox needs macOS seatbelt (sandbox-exec); mcp-server's and
      # relay-client's end-to-end cases run real sandboxed commands through it.
      - if: runner.os == 'macOS'
        run: npx vitest run packages/device-core packages/mcp-server packages/relay-client apps/desktop
      # The end-to-end transcripts. They are what caught the binary-framing bug
      # that every unit test missed, so CI runs them rather than trusting that
      # somebody remembered to.
      - if: runner.os == 'macOS'
        run: npx vitest run e2e
      # The Electron-hosted evidence: the preload bridge, the approval dialog,
      # and every first-run screen. Offscreen, but they still need a windowing
      # environment, so macOS only.
      - if: runner.os == 'macOS'
        run: |
          node apps/desktop/scripts/copy-renderer.mjs
          npx electron apps/desktop/scripts/verify-preload.mjs
          npx electron apps/desktop/scripts/approval-screenshot.mjs
          npx electron apps/desktop/scripts/onboarding-screenshot.mjs
        env:
          DOMO_HOME: ${{ runner.temp }}/domo-ci
