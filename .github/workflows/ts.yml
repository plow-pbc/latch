name: TypeScript

# The shared packages (protocol, transport) are deliberately platform-neutral,
# so they are kept building and passing on Linux as well as macOS. The device
# half — sandbox (seatbelt) and the Electron app — is macOS-only.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      # Protocol + transport are platform-independent (golden vectors, crypto,
      # the WebSocket client) and run everywhere.
      - run: npx vitest run packages/protocol packages/transport
      # The device sandbox needs macOS seatbelt (sandbox-exec), and mcp-server's
      # end-to-end cases run real sandboxed commands through it.
      - if: runner.os == 'macOS'
        run: npx vitest run packages/device-core packages/mcp-server apps/desktop
