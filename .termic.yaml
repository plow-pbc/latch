version: 1
scripts:
  # Runs in a worktree Termic has just created, so the donor is the checkout it
  # was made out of — which git records. worktree-setup.sh never infers one (see
  # its donor block), so the caller that knows the answer is the one that says it.
  setup: scripts/worktree-setup.sh "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"
  run: just app
  archive: scripts/worktree-cleanup.sh
  preview_url: ''
  files_to_copy: []
  run_scripts: []
sandbox:
  enabled_by_default: false
  allowed_hosts: []
  allowed_paths: []
exclude: []
